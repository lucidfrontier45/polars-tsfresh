[project]
name = "polars-tsfresh"
version = "0.1.1"
description = "Fast implementation of tsfresh time series feature extraction using Polars"
authors = [{ name = "杜世橋 Du Shiqiao", email = "lucidfrontier.45@gmail.com" }]
requires-python = ">=3.12"
dependencies = ["polars>=1.36.1", "numpy>=2.1"]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
keywords = [
    "time-series",
    "feature-extraction",
    "polars",
    "tsfresh",
    "data-science",
    "machine-learning",
    "statistics",
]

[project.urls]
homepage = "https://github.com/lucidfrontier45/polars-tsfresh"
repository = "https://github.com/lucidfrontier45/polars-tsfresh"
issues = "https://github.com/lucidfrontier45/polars-tsfresh/issues"

[dependency-groups]
dev = [
    "ipykernel>=7.1.0",
    "poethepoet>=0.39.0",
    "pyrefly>=0.46.3",
    "pytest-cov>=7.0.0",
    "ruff>=0.14.10",
]

[build-system]
requires = ["uv_build>=0.11.21,<0.12.0"]
build-backend = "uv_build"

[tool.uv]
managed = true

[tool.poe.tasks]
lint_check = "ruff check --fix ."
type_check = "pyrefly check ."
check = ["lint_check", "type_check"]
format = "ruff format ."
test = "pytest tests"
coverage = "pytest tests --cov=polars_tsfresh --cov-report=term --cov-report=xml"

[tool.pytest.ini_options]
filterwarnings = ["ignore::FutureWarning"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
exclude = ["tests/**/*", "deps/**/*"]

[tool.pyrefly]
python-version = "3.12"
